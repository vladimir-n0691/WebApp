<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>

    <style type="text/css">
        html, body {
            height: 100%;
            width: 100%;
        }

        #container {
            display: flex;
            height: 100%;
            width: 100%;
            place-content: center;
            align-items: center;
            align-content: center;
        }
    </style>
</head>
<body>
    <script type="text/javascript">
        async function loginClick() {
            var login = window.document.getElementById("inputLogin").value;
            var password = window.document.getElementById("inputPassword").value;

            console.log("login: " + login);
            console.log("password: " + password);

            const response = await fetch(`/api/auth/login?user=${login}&password=${password}`, {
                method: "GET",
                headers: { Accept: "application/json" },
            });

            const data = await response.json();
            if (response.ok === true) {
                sessionStorage.setItem("accessToken", data.access_token);
                console.log(data.access_token);
                window.location.href = '/';
            }
            else {
                alert("Error")
            }
        }
    </script>
    <div id="container">
        <div>
            <h3>Login Page</h3>
            <label>login:</label>
            <br />
            <input id="inputLogin" type="text"/> <br />
            <br />
            <label>password:</label>
            <br />
            <input id="inputPassword" type="password" />
            <br />
            <br />
            <button onClick="loginClick();">Login</button>
        </div>
    </div>
</body>
</html>
